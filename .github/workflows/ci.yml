name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  smoke:
    name: Integration smoke (native Postgres, no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Use the runner's PRE-INSTALLED PostgreSQL service (not a Docker container) to honor the
      # project's "no Docker" constraint. A throwaway DB is created just for this run.
      - name: Start PostgreSQL and create a disposable database
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb smoke
      - name: Smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smoke
        run: npm run smoke

  browser:
    name: Playwright browser tests (native Postgres, no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Playwright's own Chromium (not a Docker image); PWCHANNEL=chromium makes the config use it.
      - run: npx playwright install --with-deps chromium
      - name: Start PostgreSQL and create a disposable database
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb smoke
      - name: Browser tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smoke
          PWCHANNEL: chromium
        run: npm run test:browser
